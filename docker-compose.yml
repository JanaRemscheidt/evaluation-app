services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: evaluation-app:latest
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SECRET_KEY: ${SECRET_KEY:-evaluation-app-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/evaluation.sqlite3}
    volumes:
      - ./data:/app/data
    restart: unless-stopped