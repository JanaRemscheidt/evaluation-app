<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Abschlussseite der Evaluation.">
    <title>Evaluation App - Vielen Dank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="brand-lockup">
                <div class="brand-mark">✓</div>
                <div>
                    <p class="brand-kicker">Evaluation abgeschlossen</p>
                    <h1>Vielen Dank für deine Teilnahme</h1>
                </div>
            </div>
            <div class="header-badge">
                <span class="badge-dot"></span>
                <span>Abschluss</span>
            </div>
        </header>

        <main class="evaluation-layout">
            <section class="panel persona-panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Danke</p>
                        <h2>Deine Bewertung ist jetzt abgeschlossen.</h2>
                    </div>
                </div>
                <p class="panel-note">Vielen Dank, dass du dir Zeit für meine Evaluation genommen hast.</p>
                <p class="panel-note">Du kannst den Tab jetzt einfach schließen.</p>
            </section>
        </main>
    </div>
</body>
</html>
